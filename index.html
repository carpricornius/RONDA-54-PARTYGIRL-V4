function colorizeWall(text) {
  return text.split('\n').map(line => {
    const m = line.match(/^([^:]+):\s*(.*)$/);
    if (!m) return `<div class="cmt"><span style="color:#bbb">${line}</span></div>`;
    const name = m[1].trim();
    const body = m[2].trim();
    const col = authorColors[name] || '#999';
    return `<div class="cmt"><strong style="color:${col}">${name}:</strong> <span style="color:#bbb">${body}</span></div>`;
  }).join('');
}

        <div class="puesto-num ${puestoClass}">${puestoDisplay}</div>
      </div>
      <div style="text-align:right">
        <div class="puesto-label">puntos</div>
        <div class="points"><span class="num">${d.pts}</span> pts</div>
      </div>
    </div>
    <div class="song">${d.song}</div>
    <div class="meta">enviada por <strong>${d.sender}</strong></div>
    <div class="sec">
      <div class="sec-title lovers"><span class="dot lovers"></span> lovers (10/10)</div>
      <div class="tags">${lovers}</div>
    </div>
    <div class="sec">
      <div class="sec-title haters"><span class="dot haters"></span> haters (1-3)</div>
      <div class="tags">${haters}</div>
    </div>
    <div class="sec">
      <div class="sec-title wall"><span class="dot wall"></span> wall</div>
      <div class="wall">${wall}</div>
    </div>
  `;

  currSpan.textContent = idx + 1;
  btnPrev.disabled = idx === 0;
  btnNext.disabled = idx === data.length - 1;
  document.querySelectorAll('.dot-nav').forEach((dot, i) => dot.classList.toggle('active', i === idx));
}

function go(dir) {
  const next = idx + dir;
  if (next < 0 || next >= data.length) return;
  idx = next;
  wrap.classList.remove('transitioning');
  void wrap.offsetWidth;
  wrap.classList.add('transitioning');
  render();
}
function jump(i) { idx = i; wrap.classList.remove('transitioning'); void wrap.offsetWidth; wrap.classList.add('transitioning'); render(); }

data.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'dot-nav' + (d.isDesc ? ' desc' : '');
  b.onclick = () => jump(i);
  dotBox.appendChild(b);
});
render();
</script>
</body>
</html>
